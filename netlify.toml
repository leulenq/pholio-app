[build]
  # Run patch script first (strips browser fields from iconv-lite/readable-stream/pg
  # and silences extend-node.js) so esbuild bundles server-side versions correctly.
  command = "node scripts/patch-express.js && npm run build:function && npm --prefix client install --legacy-peer-deps --include=dev && npm --prefix client run build"
  publish = "public"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--include=optional"

[functions]
  # Use conventional Netlify functions directory so the server handler
  # is definitely deployed at `/.netlify/functions/server`.
  directory = "netlify/functions"
  # esbuild resolves directory requires (e.g. require('./router'), require('./util/nullUndefinedCheck'))
  # at bundle time, eliminating the entire class of nft trace bugs.
  node_bundler = "esbuild"
  included_files = ["views/**", "public/**", "migrations/**"]

[functions."server"]
  timeout = 26
  memory = 3008
  # Native binaries + packages with directory requires or ESM/CJS conflicts.
  # Knex optional dialects (mysql, tedious, oracledb) are not installed but referenced in knex source.
  external_node_modules = [
    "bcrypt", "sharp", "puppeteer", "@sparticuz/chromium", "better-sqlite3", "sqlite3",
    "mysql", "mysql2", "tedious", "oracledb", "mssql",
    "fsevents", "pg-native", "pg-query-stream",
    "firebase-admin",
    # EJS uses dynamic requires; must ship from node_modules, not esbuild bundle.
    "ejs", "express-ejs-layouts"
  ]

##
# Serve the React SPA for app routes (login/dashboard/onboarding/reveal),
# and only route backend API/auth requests to the Netlify function.
#
# This prevents a total-site 404 when the function is temporarily unavailable.
##

[[redirects]]
  from = "/favicon.ico"
  to = "/dashboard-app/favicon.svg"
  status = 200

[[redirects]]
  from = "/favicon.svg"
  to = "/dashboard-app/favicon.svg"
  status = 200

[[redirects]]
  from = "/apple-touch-icon.svg"
  to = "/dashboard-app/apple-touch-icon.svg"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server"
  status = 200

[[redirects]]
  from = "/login"
  to = "/dashboard-app/index.html"
  status = 200

[[redirects]]
  from = "/logout"
  to = "/.netlify/functions/server"
  status = 200

[[redirects]]
  from = "/signup"
  to = "/.netlify/functions/server"
  status = 200

[[redirects]]
  from = "/partners"
  to = "/.netlify/functions/server"
  status = 200

[[redirects]]
  from = "/stripe"
  to = "/.netlify/functions/server"
  status = 200

[[redirects]]
  from = "/pdf/*"
  to = "/.netlify/functions/server"
  status = 200

[[redirects]]
  from = "/dashboard/*"
  to = "/dashboard-app/index.html"
  status = 200

[[redirects]]
  from = "/onboarding/*"
  to = "/dashboard-app/index.html"
  status = 200

[[redirects]]
  from = "/reveal"
  to = "/dashboard-app/index.html"
  status = 200

[[redirects]]
  from = "/"
  to = "/dashboard-app/index.html"
  status = 200
