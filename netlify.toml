[build]
  # Run patch script first (strips browser fields from iconv-lite/readable-stream/pg
  # and silences extend-node.js) so esbuild bundles server-side versions correctly.
  command = "node scripts/patch-express.js && npm run build:function && npm run generate:favicons && npm run setup:sender-avatar && npm --prefix client install --legacy-peer-deps --include=dev && npm --prefix client run build"
  publish = "public"

[build.environment]
  # 22, not 20: puppeteer@25 requires node >=22.12 and @sparticuz/chromium@149
  # requires ^22.17. On 20 npm installs them anyway with an EBADENGINE warning,
  # then the chromium binding fails to load at runtime — production logs show
  # "[renderCompCard] @sparticuz/chromium not available, falling back to default
  # Puppeteer", which has no browser in Lambda, so comp-card PDFs cannot render.
  NODE_VERSION = "22"
  NPM_FLAGS = "--include=optional"

[functions]
  # Use conventional Netlify functions directory so the server handler
  # is definitely deployed at `/.netlify/functions/server`.
  directory = "netlify/functions"
  # esbuild resolves directory requires (e.g. require('./router'), require('./util/nullUndefinedCheck'))
  # at bundle time, eliminating the entire class of nft trace bugs.
  node_bundler = "esbuild"

[functions."server"]
  timeout = 26
  memory = 3008
  # Keep Lambda below AWS package limits. The full publish directory is still
  # deployed as static files; the function only needs runtime templates and
  # small static assets it reads directly.
  included_files = [
    "views/**",
    "migrations/**",
    # The Spec Registry and Trust Registry packs. Read at runtime by
    # taxonomy-labels.js and the registry validator; without them agency
    # requirement labels render as raw slug ids in production, and both modules
    # are fail-soft so nothing errors to say why. 368K.
    "data/**",
    "src/domains/pdf/templates/**",
    "public/agency-logos/**",
    "public/assets/**",
    "public/brand/**",
    "public/fonts/**",
    "public/images/**",
    "public/scripts/**",
    "public/styles/**",
    "public/apple-touch-icon.png",
    "public/apple-touch-icon.svg",
    "public/favicon.ico",
    "public/favicon-16x16.png",
    "public/favicon-32x32.png",
    "public/favicon.svg",
    "public/pholio-02-wordmark-primary.JPG",
    "public/dashboard-app/index.html",
  ]
  # Native binaries + packages with directory requires or ESM/CJS conflicts.
  # Knex optional dialects (mysql, tedious, oracledb) are not installed but referenced in knex source.
  external_node_modules = [
    "bcrypt", "sharp", "@img/sharp-linux-x64", "@img/sharp-libvips-linux-x64",
    "puppeteer", "@sparticuz/chromium", "better-sqlite3", "sqlite3",
    "mysql", "mysql2", "tedious", "oracledb", "mssql",
    "fsevents", "pg-native", "pg-query-stream",
    "firebase-admin",
    "harfbuzzjs",
    # EJS uses dynamic requires; must ship from node_modules, not esbuild bundle.
    "ejs", "express-ejs-layouts"
  ]

[functions."cleanup-application-drafts"]
  schedule = "@daily"
  included_files = ["migrations/**"]
  external_node_modules = [
    "better-sqlite3", "sqlite3",
    "mysql", "mysql2", "tedious", "oracledb", "mssql",
    "pg-native", "pg-query-stream",
  ]

# Discover semantic layer (tasks/discover-semantic-2026-09.md §3.5). Hourly:
# the write hooks index within seconds, this catches anything they dropped and
# sweeps the 30-day parse/embed caches.
[functions."discover-reindex"]
  schedule = "@hourly"
  included_files = ["migrations/**"]
  external_node_modules = [
    "better-sqlite3", "sqlite3",
    "mysql", "mysql2", "tedious", "oracledb", "mssql",
    "pg-native", "pg-query-stream",
  ]

##
# Serve the React SPA for app routes (login/dashboard/onboarding/reveal),
# and only route backend API/auth requests to the Netlify function.
#
# This prevents a total-site 404 when the function is temporarily unavailable.
##

[[redirects]]
  from = "/favicon.ico"
  to = "/dashboard-app/favicon.ico"
  status = 200

[[redirects]]
  from = "/favicon-16x16.png"
  to = "/dashboard-app/favicon-16x16.png"
  status = 200

[[redirects]]
  from = "/favicon-32x32.png"
  to = "/dashboard-app/favicon-32x32.png"
  status = 200

[[redirects]]
  from = "/favicon.svg"
  to = "/dashboard-app/favicon.svg"
  status = 200

[[redirects]]
  from = "/apple-touch-icon.png"
  to = "/dashboard-app/apple-touch-icon.png"
  status = 200

[[redirects]]
  from = "/apple-touch-icon.svg"
  to = "/dashboard-app/apple-touch-icon.svg"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server"
  status = 200

[[redirects]]
  from = "/login"
  to = "/dashboard-app/index.html"
  status = 200

[[redirects]]
  from = "/logout"
  to = "/.netlify/functions/server"
  status = 200

[[redirects]]
  from = "/signup"
  to = "/.netlify/functions/server"
  status = 200

[[redirects]]
  from = "/partners"
  to = "/.netlify/functions/server"
  status = 200

[[redirects]]
  from = "/stripe"
  to = "/.netlify/functions/server"
  status = 200

# Sub-paths of the Stripe mount (webhook, create-checkout-session,
# checkout/success, customer-portal). Without this splat they fall through to
# the static publish dir and 404 — the webhook never reaches Express, so no
# subscription ever activates.
[[redirects]]
  from = "/stripe/*"
  to = "/.netlify/functions/server"
  status = 200

[[redirects]]
  from = "/pdf/*"
  to = "/.netlify/functions/server"
  status = 200

[[redirects]]
  from = "/dashboard/*"
  to = "/dashboard-app/index.html"
  status = 200

##
# Token-authenticated public SPA pages (ruling R9).
#
# All three of these are real React routes (client/src/App.jsx) and all three
# are in the Express SPA allowlist (src/app.js), but neither of those runs in
# production unless a redirect sends the request somewhere. With no rule here,
# `/reply/abc` and `/opencall/xyz` were resolved against the publish directory,
# found nothing, and returned Netlify's generic 404 — the magic-link reply page
# and the open-call arrival page have never loaded on the deployed site. The
# API halves (`/api/reply/*`, `/api/picks/*`) were always fine: `/api/*` above
# catches them, and it is matched first.
##

[[redirects]]
  from = "/picks/*"
  to = "/dashboard-app/index.html"
  status = 200

[[redirects]]
  from = "/reply/*"
  to = "/dashboard-app/index.html"
  status = 200

[[redirects]]
  from = "/opencall/*"
  to = "/dashboard-app/index.html"
  status = 200

# Casting SPA pages (client-side steps live under /onboarding only)
[[redirects]]
  from = "/onboarding/test"
  to = "/dashboard-app/index.html"
  status = 200

[[redirects]]
  from = "/onboarding/preview-reveal"
  to = "/dashboard-app/index.html"
  status = 200

[[redirects]]
  from = "/onboarding"
  to = "/dashboard-app/index.html"
  status = 200

# Casting API + other /onboarding/* backend routes (entry, status, scout, …)
[[redirects]]
  from = "/onboarding/*"
  to = "/.netlify/functions/server"
  status = 200

[[redirects]]
  from = "/upload"
  to = "/.netlify/functions/server"
  status = 200

[[redirects]]
  from = "/uploads/*"
  to = "/.netlify/functions/server"
  status = 200

[[redirects]]
  from = "/portfolio/*"
  to = "/.netlify/functions/server"
  status = 200

[[redirects]]
  from = "/reveal"
  to = "/dashboard-app/index.html"
  status = 200

# The QR / NFC target printed on every comp card. Server-rendered, so it must
# reach the function — without this rule every printed card scans to a 404.
[[redirects]]
  from = "/p/*"
  to = "/.netlify/functions/server"
  status = 200

# SPA routes that had no rule. `/login` was matched EXACTLY, so
# `/login/forgot-password` 404'd — password reset was unreachable in production.
[[redirects]]
  from = "/login/*"
  to = "/dashboard-app/index.html"
  status = 200

[[redirects]]
  from = "/reset-password"
  to = "/dashboard-app/index.html"
  status = 200

[[redirects]]
  from = "/apply"
  to = "/dashboard-app/index.html"
  status = 200

[[redirects]]
  from = "/agency"
  to = "/dashboard-app/index.html"
  status = 200

[[redirects]]
  from = "/messages"
  to = "/dashboard-app/index.html"
  status = 200

[[redirects]]
  from = "/activity"
  to = "/dashboard-app/index.html"
  status = 200

[[redirects]]
  from = "/internal"
  to = "/dashboard-app/index.html"
  status = 200

[[redirects]]
  from = "/internal/*"
  to = "/dashboard-app/index.html"
  status = 200

[[redirects]]
  from = "/auth/instagram/callback"
  to = "/dashboard-app/index.html"
  status = 200

[[redirects]]
  from = "/"
  to = "/dashboard-app/index.html"
  status = 200

# Last rule, and a safety net rather than a substitute for the explicit ones
# above. Netlify takes the FIRST match, so every server route and asset rule has
# already had its chance by the time anything reaches this. Its job is that a
# client route added later reaches the SPA instead of a Netlify 404 — which is
# how password reset and the comp-card QR came to be broken in the first place.
# The SPA renders its own not-found for a genuinely unknown path.
[[redirects]]
  from = "/*"
  to = "/dashboard-app/index.html"
  status = 200
