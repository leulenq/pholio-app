<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:ital,wght@0,300;0,400;0,500;1,300;1,400&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
  <style>
    html, body { margin: 0; background: #050505; }
    * { box-sizing: border-box; }
    a { color: #C9A55A; } a:hover { color: #A8894E; }
    h1, h2, p { margin: 0; }
  </style>
</helmet>
<div style="position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #050505; color: #FAF7F2; font-family: Inter, 'Helvetica Neue', Arial, sans-serif;">

  <h2 style="position: absolute; left: 120px; top: 90px; width: 1600px; font-family: 'Noto Serif Display', 'Didot', 'Bodoni 72', Georgia, serif; font-weight: 400; font-size: 72px; line-height: 1.05; letter-spacing: -0.005em; text-wrap: pretty; ">About four minutes on a phone. <span style="font-style: italic; font-weight: 300; color: #C9A55A;">No account.</span></h2>
  <div style="position: absolute; left: 120px; right: 120px; top: 250px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 34px;">
    <div style="display: flex; flex-direction: column; gap: 22px;">
      <div style="padding: 6px; border-radius: 34px; background: #1C1B19; border: 1px solid rgba(250,247,242,0.14); box-shadow: 0 30px 60px rgba(0,0,0,0.6);"><img src="m-invite.jpg" alt="" style="display: block; width: 100%; border-radius: 28px;"></div>
      <span style="font-family: 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 18px; color: rgba(250,247,242,0.58);">Your invitation</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 22px;">
      <div style="padding: 6px; border-radius: 34px; background: #1C1B19; border: 1px solid rgba(250,247,242,0.14); box-shadow: 0 30px 60px rgba(0,0,0,0.6);"><img src="m-height.jpg" alt="" style="display: block; width: 100%; border-radius: 28px;"></div>
      <span style="font-family: 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 18px; color: rgba(250,247,242,0.58);">One question per screen</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 22px;">
      <div style="padding: 6px; border-radius: 34px; background: #1C1B19; border: 1px solid rgba(250,247,242,0.14); box-shadow: 0 30px 60px rgba(0,0,0,0.6);"><img src="m-measure.jpg" alt="" style="display: block; width: 100%; border-radius: 28px;"></div>
      <span style="font-family: 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 18px; color: rgba(250,247,242,0.58);">Stats, as they write them</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 22px;">
      <div style="padding: 6px; border-radius: 34px; background: #1C1B19; border: 1px solid rgba(250,247,242,0.14); box-shadow: 0 30px 60px rgba(0,0,0,0.6);"><img src="m-email.jpg" alt="" style="display: block; width: 100%; border-radius: 28px;"></div>
      <span style="font-family: 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 18px; color: rgba(250,247,242,0.58);">Where the receipt goes</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 22px;">
      <div style="padding: 6px; border-radius: 34px; background: #1C1B19; border: 1px solid rgba(250,247,242,0.14); box-shadow: 0 30px 60px rgba(0,0,0,0.6);"><img src="m-photos.jpg" alt="" style="display: block; width: 100%; border-radius: 28px;"></div>
      <span style="font-family: 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 18px; color: rgba(250,247,242,0.58);">Photos last</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 22px;">
      <div style="padding: 6px; border-radius: 34px; background: #1C1B19; border: 1px solid rgba(250,247,242,0.14); box-shadow: 0 30px 60px rgba(0,0,0,0.6);"><img src="m-sent.jpg" alt="" style="display: block; width: 100%; border-radius: 28px;"></div>
      <span style="font-family: 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 18px; color: rgba(250,247,242,0.58);">Sent</span>
    </div>
  </div>
  <div style="position: absolute; left: 120px; right: 120px; bottom: 48px; display: flex; justify-content: space-between; align-items: baseline; font-family: 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 15px; color: rgba(250,247,242,0.58);">
    <span style="font-family: 'Noto Serif Display', 'Didot', 'Bodoni 72', Georgia, serif; font-size: 19px; letter-spacing: 0.22em; color: #FAF7F2;">PHOLIO</span>
    <span>15 / 38</span>
  </div>
</div>
</x-dc>
</body>
</html>
