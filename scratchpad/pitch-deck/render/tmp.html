  <p style="position: absolute; left: 970px; top: 620px; width: 820px; font-family: Inter, 'Helvetica Neue', Arial, sans-serif; font-size: 28px; line-height: 1.45; color: rgba(250,247,242,0.58); text-wrap: pretty;">Talent can pay for studio tools they keep — never for access, visibility, or a better place in your desk.</p>
