[build]
  # Run patch script first (strips browser fields from iconv-lite/readable-stream/pg
  # and silences extend-node.js) so esbuild bundles server-side versions correctly.
  command = "node scripts/patch-express.js && npm run build:function && npm run generate:favicons && npm run setup:sender-avatar && npm --prefix client install --legacy-peer-deps --include=dev && npm --prefix client run build"
  publish = "public"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--include=optional"

[functions]
  # Use conventional Netlify functions directory so the server handler
  # is definitely deployed at `/.netlify/functions/server`.
  directory = "netlify/functions"
  # esbuild resolves directory requires (e.g. require('./router'), require('./util/nullUndefinedCheck'))
  # at bundle time, eliminating the entire class of nft trace bugs.
  node_bundler = "esbuild"

[functions."server"]
  timeout = 26
  memory = 3008
  # Keep Lambda below AWS package limits. The full publish directory is still
  # deployed as static files; the function only needs runtime templates and
  # small static assets it reads directly.
  included_files = [
    "views/**",
    "migrations/**",
    "src/domains/pdf/templates/**",
    "public/agency-logos/**",
    "public/assets/**",
    "public/brand/**",
    "public/fonts/**",
    "public/images/**",
    "public/scripts/**",
    "public/styles/**",
    "public/apple-touch-icon.png",
    "public/apple-touch-icon.svg",
    "public/favicon.ico",
    "public/favicon-16x16.png",
    "public/favicon-32x32.png",
    "public/favicon.svg",
    "public/pholio-02-wordmark-primary.JPG",
    "public/dashboard-app/index.html",
  ]
  # Native binaries + packages with directory requires or ESM/CJS conflicts.
  # Knex optional dialects (mysql, tedious, oracledb) are not installed but referenced in knex source.
  external_node_modules = [
    "bcrypt", "sharp", "@img/sharp-linux-x64", "@img/sharp-libvips-linux-x64",
    "puppeteer", "@sparticuz/chromium", "better-sqlite3", "sqlite3",
    "mysql", "mysql2", "tedious", "oracledb", "mssql",
    "fsevents", "pg-native", "pg-query-stream",
    "firebase-admin",
    "harfbuzzjs",
    # EJS uses dynamic requires; must ship from node_modules, not esbuild bundle.
    "ejs", "express-ejs-layouts"
  ]

[functions."cleanup-application-drafts"]
  schedule = "@daily"
  included_files = ["migrations/**"]
  external_node_modules = [
    "better-sqlite3", "sqlite3",
    "mysql", "mysql2", "tedious", "oracledb", "mssql",
    "pg-native", "pg-query-stream",
  ]

##
# Serve the React SPA for app routes (login/dashboard/onboarding/reveal),
# and only route backend API/auth requests to the Netlify function.
#
# This prevents a total-site 404 when the function is temporarily unavailable.
##

[[redirects]]
  from = "/favicon.ico"
  to = "/dashboard-app/favicon.ico"
  status = 200

[[redirects]]
  from = "/favicon-16x16.png"
  to = "/dashboard-app/favicon-16x16.png"
  status = 200

[[redirects]]
  from = "/favicon-32x32.png"
  to = "/dashboard-app/favicon-32x32.png"
  status = 200

[[redirects]]
  from = "/favicon.svg"
  to = "/dashboard-app/favicon.svg"
  status = 200

[[redirects]]
  from = "/apple-touch-icon.png"
  to = "/dashboard-app/apple-touch-icon.png"
  status = 200

[[redirects]]
  from = "/apple-touch-icon.svg"
  to = "/dashboard-app/apple-touch-icon.svg"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server"
  status = 200

[[redirects]]
  from = "/login"
  to = "/dashboard-app/index.html"
  status = 200

[[redirects]]
  from = "/logout"
  to = "/.netlify/functions/server"
  status = 200

[[redirects]]
  from = "/signup"
  to = "/.netlify/functions/server"
  status = 200

[[redirects]]
  from = "/partners"
  to = "/.netlify/functions/server"
  status = 200

[[redirects]]
  from = "/stripe"
  to = "/.netlify/functions/server"
  status = 200

[[redirects]]
  from = "/pdf/*"
  to = "/.netlify/functions/server"
  status = 200

[[redirects]]
  from = "/dashboard/*"
  to = "/dashboard-app/index.html"
  status = 200

# Casting SPA pages (client-side steps live under /onboarding only)
[[redirects]]
  from = "/onboarding/test"
  to = "/dashboard-app/index.html"
  status = 200

[[redirects]]
  from = "/onboarding/preview-reveal"
  to = "/dashboard-app/index.html"
  status = 200

[[redirects]]
  from = "/onboarding"
  to = "/dashboard-app/index.html"
  status = 200

# Casting API + other /onboarding/* backend routes (entry, status, scout, …)
[[redirects]]
  from = "/onboarding/*"
  to = "/.netlify/functions/server"
  status = 200

[[redirects]]
  from = "/upload"
  to = "/.netlify/functions/server"
  status = 200

[[redirects]]
  from = "/uploads/*"
  to = "/.netlify/functions/server"
  status = 200

[[redirects]]
  from = "/portfolio/*"
  to = "/.netlify/functions/server"
  status = 200

[[redirects]]
  from = "/reveal"
  to = "/dashboard-app/index.html"
  status = 200

[[redirects]]
  from = "/"
  to = "/dashboard-app/index.html"
  status = 200
