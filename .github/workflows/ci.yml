name: CI

on:
  push:
  pull_request:

env:
  CI: true

jobs:
  client-build:
    name: Client build (required)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm ci --prefix client --legacy-peer-deps

      - name: Build client
        run: npm run --prefix client build

  client-test:
    name: Client tests (required)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm ci --prefix client --legacy-peer-deps

      - name: Run client tests
        run: npm run --prefix client test

  server-test:
    name: Server tests (required)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Run server tests
        run: npm test

  client-lint:
    name: Client lint (required)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install client dependencies
        run: npm ci --prefix client --legacy-peer-deps

      - name: Run client lint
        run: npm run --prefix client lint
